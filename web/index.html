<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale/user-scalable=no でブラウザ自身のピンチズームを止める。
         付けないと、スマホでの二本指ピンチがカメラのズームではなく
         ページ全体の拡大に吸われてしまう（実機で報告あり）。ピンチ操作は
         main.ts の pointerdown/pointermove ハンドラでカメラのズームに
         変換する。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>battle-sim</title>
    <!-- favicon の 404 を防ぐ。正式なアイコンは M8 で差し替える -->
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1014;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      #terrain-view,
      #soldier-view,
      #overlay-view {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        cursor: grab;
        /* ブラウザのタッチジェスチャ（ピンチズーム・パン・ダブルタップ拡大）を
           奪わせない。奪われるとポインタイベントがゲーム側へ届かず、
           main.ts の二本指ピンチ処理が動かない。 */
        touch-action: none;
      }
      #overlay-view {
        pointer-events: none;
      }
      #view-stack:active #overlay-view {
        cursor: grabbing;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        background: rgba(10, 14, 20, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        color: #d8dee6;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre;
        pointer-events: none;
      }
      #help {
        position: fixed;
        bottom: 12px;
        left: 12px;
        padding: 8px 12px;
        background: rgba(10, 14, 20, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        color: #8c98a6;
        font-size: 11px;
        line-height: 1.7;
        white-space: pre;
        pointer-events: none;
      }
      #right-stack {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: calc(100vh - 24px);
        max-width: 320px;
      }
      #command-panel,
      #detail-panel,
      #scenario-panel {
        padding: 10px 14px;
        background: rgba(10, 14, 20, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        color: #d8dee6;
        font-size: 11px;
        line-height: 1.6;
        overflow-y: auto;
      }
      #command-panel {
        max-height: 46vh;
      }
      #detail-panel {
        /* 判断まわり（任務・行動候補・局所知覚）を足したぶん、指揮系統と同じ
           高さまで見えるようにする。あふれた分はこのパネル内でスクロールする。 */
        max-height: 46vh;
      }
      #scenario-panel {
        position: fixed;
        top: 12px;
        left: 12px;
        margin-top: 132px;
        max-width: 300px;
        max-height: 52vh;
      }
      #session-panel {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 10px;
        background: rgba(10, 14, 20, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        color: #d8dee6;
        font-size: 11px;
      }
      #battle-report {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 16px 20px;
        background: rgba(10, 14, 20, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: #d8dee6;
        font-size: 13px;
        line-height: 1.8;
        z-index: 10;
      }
      .panel-title {
        font-weight: 600;
        color: #e8c96a;
        margin-bottom: 4px;
      }
      .panel-subtitle {
        margin-top: 6px;
        color: #8c98a6;
      }
      .node-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-bottom: 6px;
      }
      .node-row {
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 3px;
        white-space: pre;
      }
      .node-row:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .node-row.possessed {
        background: rgba(61, 122, 184, 0.35);
        outline: 1px solid #3d7ab8;
      }
      .node-row.pickable {
        outline: 1px dashed #d98032;
      }
      .order-controls {
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        padding-top: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .order-row {
        width: 100%;
        display: flex;
        gap: 4px;
      }
      .pick-hint {
        margin-top: 6px;
        padding: 4px 6px;
        background: rgba(217, 128, 50, 0.2);
        border: 1px solid #d98032;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }
      .status-line {
        margin-top: 4px;
        color: #7ad17a;
      }
      .follow-status {
        margin-top: 4px;
        color: #6ac9e8;
      }
      button,
      select {
        font-family: inherit;
        font-size: 11px;
        color: #d8dee6;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 4px;
        padding: 3px 7px;
        cursor: pointer;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.16);
      }
    </style>
  </head>
  <body>
    <div id="view-stack">
      <canvas id="terrain-view"></canvas>
      <canvas id="soldier-view"></canvas>
      <canvas id="overlay-view"></canvas>
    </div>
    <div id="hud">起動中…</div>
    <div id="session-panel"></div>
    <div id="scenario-panel"></div>
    <div id="right-stack">
      <div id="command-panel"></div>
      <div id="detail-panel"></div>
    </div>
    <div id="battle-report"></div>
    <div id="help">
ドラッグ  パン
ホイール  ズーム（対数）
クリック  部隊/兵士を選択
Space     一時停止 / 再開
1〜5      速度 1x / 2x / 4x / 8x / 16x
Q W E R T 視野 5km / 1km / 200m / 40m / 10m</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
