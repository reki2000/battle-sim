<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>battle-sim</title>
    <!-- favicon の 404 を防ぐ。正式なアイコンは M8 で差し替える -->
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1014;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      #terrain-view,
      #overlay-view {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        cursor: grab;
      }
      #overlay-view {
        pointer-events: none;
      }
      #view-stack:active #overlay-view {
        cursor: grabbing;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        background: rgba(10, 14, 20, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        color: #d8dee6;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre;
        pointer-events: none;
      }
      #help {
        position: fixed;
        bottom: 12px;
        left: 12px;
        padding: 8px 12px;
        background: rgba(10, 14, 20, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        color: #8c98a6;
        font-size: 11px;
        line-height: 1.7;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="view-stack">
      <canvas id="terrain-view"></canvas>
      <canvas id="overlay-view"></canvas>
    </div>
    <div id="hud">起動中…</div>
    <div id="help">
ドラッグ  パン
ホイール  ズーム（対数）
Space     一時停止 / 再開
1〜5      速度 1x / 2x / 4x / 8x / 16x
Q W E R T 視野 5km / 1km / 200m / 40m / 10m</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
