# シミュレーターが所有する視覚要件。史実上の服装・武具の詳細はここに置かず、
# スプライト生成スキルがこの役割と行動の境界を保ったまま史料調査する。

schema_version = 1
id = "medieval_western"
name_ja = "14世紀ヨーロッパ軍"

[historical_context]
period_id = "14c"
period_label = "14th century CE"
region_id = "europe"
region_label = "Europe"

[asset_defaults]
style_id = "photorealistic-full-color"

[[actions]]
id = "idle"
description = "4種類の待機スタイルから兵士ごとに1つを固定選択し、各スタイルの2フレームを循環する待機動作"
loop = true
playback = "variant-loop"
variant_count = 4
frames_per_variant = 2
frames_per_second = 2

[[actions]]
id = "walk"
description = "隊形を維持して通常速度で前進・再配置する循環歩行"
loop = true
playback = "cycle"
variant_count = 1
frames_per_variant = 8
frames_per_second = 8

[[actions]]
id = "run"
description = "突撃または潰走時に高速移動する循環走行"
loop = true
playback = "cycle"
variant_count = 1
frames_per_variant = 8
frames_per_second = 8

[[actions]]
id = "combat"
description = "兵科の主武器で攻撃し、構えへ復帰する循環白兵動作"
loop = true
playback = "cycle"
variant_count = 1
frames_per_variant = 8
frames_per_second = 8

[[actions]]
id = "shoot"
description = "射撃武器を狙い、1発を放ち、追随動作へ移る循環動作"
loop = true
playback = "cycle"
variant_count = 1
frames_per_variant = 8
frames_per_second = 8

[[actions]]
id = "reload"
description = "兵科の射撃武器へ次弾を装填し、射撃可能姿勢へ戻る循環動作"
loop = true
playback = "cycle"
variant_count = 1
frames_per_variant = 8
frames_per_second = 8

[[actions]]
id = "dead"
description = "時間変化しない8種類の倒れ姿から兵士ごとに1つを固定選択する"
loop = false
playback = "static-variants"
variant_count = 8
frames_per_variant = 1
frames_per_second = 0

[[roles]]
id = "men-at-arms"
troop_type_id = "men_at_arms"
troop_type_index = 0
name_ja = "重装兵"
name_en = "Men-at-arms"
description = "徒歩で隊列戦と白兵戦を担う、比較的重装備の職業的戦闘員。特定の服装や武具形式はスキルが14世紀ヨーロッパの史料から確定する。"
actions = ["idle", "walk", "run", "combat", "dead"]

[roles.state_actions]
idle = "idle"
marching = "walk"
repositioning = "walk"
advancing = "walk"
charging = "run"
engaged = "combat"
shooting = "combat"
reloading = "idle"
