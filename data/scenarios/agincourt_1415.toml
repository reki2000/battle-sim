# アジンクールの会戦（1415 年 10 月 25 日）。
#
# 仕様 10 章 10 節のシナリオ形式のうち、現時点のシミュレータが解釈できる範囲を
# 書いたもの。TOML の実行時ローダー（`sim-data`）はまだ無いので、これは
# 人間が読む正本であり、実際に読まれるのは同じ内容を写した
# `crates/sim-core/src/scenario.rs` の `AGINCOURT_1415`。
# 数値を変えるときは両方を直すこと（`data/formations.toml` と
# `organization::formation_def` の関係と同じ）。
#
# 座標系: x は西→東、y は南→北。英軍が南（y 小）、仏軍が北（y 大）に立つ。
# `facing` は隊列のランクが伸びる向き（0 = +Y、180 = -Y）。

[scenario]
id = "agincourt_1415"
name_ja = "アジンクールの会戦"
name_en = "Battle of Agincourt"
year = 1415
place_ja = "北フランス・アルトワ"
summary_ja = "森に挟まれた泥濘の耕地。数で劣る英軍が杭列と長弓で待ち構える。"
historical_strength_ja = "史実の推定兵力: 英 約6,000〜9,000 / 仏 約12,000〜15,000"
# 縮尺: 兵数と会戦場の幅をおよそ 1/4 にしてある。両者を同じ比で縮めることで、
# 「森に挟まれて敵より広い正面を取れない」という会戦の骨格を保つ。
scale_note_ja = "ブラウザで回せるよう、兵数と会戦場の幅をおよそ 1/4 に縮尺してある"

[terrain]
seed = "0x4A17_C0FF_1415_0001"
size_m = 1200
cell_m = 2
relief = 0                # 起伏のない平野。高低差は下の height_ramp で与える
forest_cover = 300        # 会戦場の外に散る林の量（会戦場は下の整形で塗り替わる）
marsh_bias = 250          # 秋の長雨
thermal_iterations = 6
road_count = 1
sea = "none"

# 生成後に焼き込む地勢（`sim_terrain::shaping`）。適用順に意味がある——
# 耕地を敷き、泥濘の帯を重ね、最後に森を置く。
[[terrain.shaping]]
kind = "surface_rect"
surface = "Farmland"      # 刈り取りの済んだ耕地
x_m = 380
y_m = 150
w_m = 440
h_m = 950

[[terrain.shaping]]
kind = "surface_rect"
surface = "Mud"           # 前夜からの雨と数千の足で捏ねられた泥
x_m = 430
y_m = 400
w_m = 340
h_m = 360

[[terrain.shaping]]
kind = "surface_belt"     # 西のアジャンクール村の森
surface = "DenseForest"
a = [300, 1200]
b = [400, 0]
half_width_m = 130

[[terrain.shaping]]
kind = "surface_belt"     # 東のトラムクール村の森
surface = "DenseForest"
a = [900, 1200]
b = [800, 0]
half_width_m = 130
# 2 つ合わせて、会戦場は北の 340 m から英軍正面の 210 m まで狭まる。

[[terrain.shaping]]
kind = "height_ramp"      # 英軍の立つ南側がわずかに高い
axis = "y"
from_m = 350
to_m = 750
from_cm = 500
to_cm = 0

