# wasm32 向けビルドで simd128 をターゲット機能として有効にする（M9）。
#
# 明示的な simd128 命令をハンドコーディングする案（`sim-core` の空間ハッシュ近傍
# 探索の float フリーな距離計算を 4 件ずつまとめて計算する）は試作・実測した上で
# 見送った。候補位置は空間ハッシュの近傍クエリ由来で連続領域に無いため、
# レーンをスカラー値から組み立てる必要があり（`i32x4(a,b,c,d)`）、実際に
# wasm-opt 適用後の V8 上で計測すると素直なスカラーループの約 8〜10 倍遅かった
# （`v128_load` による連続メモリからの読み込みなら速いはずだが、それは `unsafe`
# を要求する関数で、シミュレーション中核クレートの `#![forbid(unsafe_code)]` と
# 両立しない）。背景と再検証方針は `TODO.md` の性能改善項目を参照。
#
# それでも simd128 をターゲット機能として有効にしておくこと自体は無害で、
# LLVM の自動ベクトル化が該当する場面で使う余地を残せるため、フラグだけは残す。
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
